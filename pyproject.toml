[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picnic-ai"
version = "0.1.0"
description = "Picnic boodschappen-integratie voor AI-assistenten (MCP-server + CLI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "mcp>=2",
]

[project.scripts]
picnic = "picnic_ai.cli:main"
picnic-mcp = "picnic_ai.server:main"

[tool.setuptools.packages.find]
include = ["picnic_ai*"]
